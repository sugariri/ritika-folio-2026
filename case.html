<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case study &middot; Ritika Shakkerwal</title>
  <meta name="description" content="Case studies from Ritika Shakkerwal: product design across AI video, user insights, internal tools, and mobile.">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#fcfcfc">
  <!-- Theme resolved before first paint so the page never flashes the wrong
       one. Stored choice wins; otherwise the OS preference. Same script and
       same localStorage key as index.html, so the choice carries across. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* Tokens mirrored from index.html — any new colour goes here as a variable */
    :root {
      color-scheme: light;

      --gray-1:  #fcfcfc;
      --gray-4:  #ececef;
      --gray-7:  #acacb9;
      --gray-9:  #6d6d78; /* darkest step that still reads as "faint" — 4.98:1 on --bg */
      --gray-10: #5d5d6f;
      --gray-14: #2c2c35;

      --bg: var(--gray-1);
      --bg-card: #ffffff;
      --bg-raised: #f6f6f7;
      --pain-bg: #f0efff;   /* .chapter-key's ground, finsynth's value */
      /* The theme switch's two grounds. Each page names its raised surface
         differently (--bg-secondary here, --bg-raised on the case studies), so
         the switch aliases them once and the .theme-switch block below is then
         identical in all three files. The knob has one job: read lighter than
         the track it rides on, in both themes. */
      --switch-track: var(--bg-raised);
      --switch-knob: var(--bg-card);
      --bg-stage: linear-gradient(135deg, #f4f4f6, #fbfbfb);
      --bg-float: var(--bg);  /* the chat, lifted off the page in dark */
      /* The ask pill sits on the page, not in it: a true white card a
         step off --bg so it never reads as part of the column. The
         --glow-* set is the first-visit attract ring, in site purple. */
      --ask-pill-bg: #ffffff;
      --glow-ink:    #752afc;
      --glow-strong: rgba(117, 42, 252, 0.90);
      --glow-soft:   rgba(117, 42, 252, 0.34);
      /* The mat the hero screen sits on. Sampled from the FinSynth
         marketing band — core #345bc3, lifting toward the top. Artwork, so
         it never flips; --blue-ink is the same blue for drawn diagram ink,
         which does flip because it sits on the page's own ground. */
      --blue-core: #345bc3;
      --blue-ink: var(--blue-core);
      --fail: #b3352c; /* failed-step ink in the tool-call timeline — 8.5:1 on white */
      --mat-shade: rgba(10, 22, 66, 0.16);
      --mat-lift:  rgba(10, 22, 66, 0.50);
      /* macOS traffic lights — decorative browser chrome only, never UI meaning */
      --tl-close: #ff5f57;
      --tl-min:   #febc2e;
      --tl-max:   #28c840;
      /* Dia-style blush chrome — decorative browser frame only, never UI meaning */
      --chrome-bg:    #f9e3ea;
      --chrome-pill:  #f1cfda;
      --chrome-ink:   #6b4a58;
      --chrome-faint: #ab7f90;
      /* The browser-window illustration frames real light screenshots, so its
         chrome is artwork too: these four never flip, or a white shot would
         sit in half-dark chrome. The blush --chrome-* above are already
         literal for the same reason. */
      --art-bg:    #ffffff;
      --art-ink:   var(--gray-14);
      --art-muted: var(--gray-10);
      --art-line:  rgba(0, 0, 0, 0.08);
      --text: var(--gray-14);
      --muted: var(--gray-10);
      --faint: var(--gray-9);
      --line: rgba(0, 0, 0, 0.08);
      --line-hover: rgba(0, 0, 0, 0.16); /* the hovered ask pill */
      --logo: #752afc; /* riri wordmark — site purple, the same value as --brand */
      /* --brand is referenced by the two :focus-visible outlines in the header
         and was never defined in this file — drift from index.html, where the
         token lives. Defined here for the same reason it now is in
         finsynth.html: the header is shared shell, so the ring it draws should
         be too. */
      --brand: #752afc;
      --brand-hover: #6109de;

      /* Shadows are theme-dependent: on a dark page a soft black blur does
         nothing, so the dark set is deeper and tighter. */
      --shadow-note:   0 8px 16px -10px rgba(20, 20, 26, 0.4);
      --shadow-pill:   0 16px 40px -10px rgba(18, 18, 28, 0.30), 0 3px 10px rgba(18, 18, 28, 0.10);
      --shadow-drawer: -16px 0 48px rgba(0, 0, 0, 0.08);
      --shadow-pop:    0 24px 64px rgba(0, 0, 0, 0.16), 0 2px 8px rgba(0, 0, 0, 0.06);

      /* Diagram ink — the drawn figures read as one set because of these.
         --dia-box is only the .slot dash now; boxes ink at full --text. */
      --dia-box: rgba(0, 0, 0, 0.16);
      --dia-ink: rgba(0, 0, 0, 0.66);
      --dia-dot: rgba(0, 0, 0, 0.13);

      /* ---------- TYPE SCALE ---------- */
      /* Six roles, and six is the whole point. Across the three pages there
         were seventeen distinct font-sizes in play — 10, 12, 12.5, 13, 14, 15,
         16, 17, 18, 19, 20, 21, 23, 24, 26, 30, 32 — which is not a scale, it
         is a pile, and it is why the type read as broken (Ritika, 2026-08-22:
         "the text type the page still feels broken"). Two of those were
         structural, not just noise: h2 was declared at both 26px (bare) and
         32px (.chapter-head), and h3 at 26px — the same size as the smaller h2
         — so the heading hierarchy was inverted wherever the two met.

         The ladder is a major third off a 17px reading size. Anything needing
         a distinction the six can't make reaches for INK or WEIGHT, never a
         seventh size. That rule was already written for the chapter heads
         ("four levels on two type sizes, because colour and the rule do the
         rest") — this only generalises it to the whole site.

         Each role ships its line-height alongside, because a size without its
         leading is half a decision, and that is how one 22px leading ended up
         on 13px, 15px and 17px text alike.

         What is deliberately NOT on the scale: artwork. The pixel cat, the
         Caveat handwriting on the problem wall and the voice notes, the fake
         browser chrome in .fiag-*, the avatar monograms, the mono labels
         inside a .product-frame stage. Those are sized to their own box the
         way the cat is, and a page-scale bump must not resize a mock's UI. */
      --h1: clamp(32px, 7vw, 44px);   --h1-lh: 1.16;    /* page title */
      --h2: 30px;                     --h2-lh: 1.28;    /* section / chapter title */
      --h3: 22px;                     --h3-lh: 1.4;     /* sub-head, pull, card title */
      --body1: 17px;                  --body1-lh: 1.7;  /* reading prose, standfirst */
      --body2: 15px;                  --body2-lh: 1.55; /* UI, meta, captions */
      --pill: 12px;                   --pill-lh: 1;     /* mono micro-caps tags and keys */

      --font: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      /* The problem wall is the one place the page uses colour as material */
      --hand: 'Caveat', 'Segoe Script', cursive;
      --note-a: #fdf0b8;
      --note-b: #d9e4fb;
      --note-c: #d7ecdc;

      --content: 660px;
      --measure: 760px;   /* figures break out to here */
      --gutter: 24px;

    }

    /* The scale steps down as one thing, not rule by rule. Before this, three
       separate rules carried their own phone size (.standfirst 19, .decision
       h3 23, .evo-hinge 14) and drifted apart from each other; h1 already
       stepped via its own clamp, and body1/body2 hold at any measure. */
    @media (max-width: 720px) {
      :root { --h2: 26px; --h3: 20px; }
    }

    /* ---------- DARK ----------
       The head script resolves the stored choice (or the OS preference) into
       data-theme on <html> before first paint, so this is the only place a
       dark colour is written: every rule below still reads the same token.
       Deliberately untouched: the grey ramp (it is the fixed dark ink the
       sticky notes and .strip-say are written in), the blush --chrome-*, the
       --art-* set, --blue-core and the traffic lights and the pale --note-*.
       All of those are artwork — a light product screenshot must not end up
       framed in half-dark chrome, and a negative of a sticky note is not a
       sticky note. Drawn figures, which are only ink on the page's own
       ground, do flip. */
    :root[data-theme="dark"] {
      color-scheme: dark;

      --bg: #101013;
      --bg-card: #16161b;
      --bg-raised: #1c1c22;
      --pain-bg: #242231;
      --switch-track: var(--bg-card);
      --switch-knob: var(--ask-pill-bg);
      --bg-stage: linear-gradient(135deg, #17171d, #1b1b22);
      /* the chat lifts off the page instead of relying on a shadow, which
         does almost nothing against near-black */
      --bg-float: #1a1a20;
      --ask-pill-bg: #22222b;
      --glow-ink:    #a97bff;
      --glow-strong: rgba(169, 123, 255, 0.95);
      --glow-soft:   rgba(169, 123, 255, 0.40);
      --text: #ededf2;
      --muted: #a6a6b6;
      --faint: #8b8b9c;
      --line: rgba(255, 255, 255, 0.10);
      --line-hover: rgba(255, 255, 255, 0.24);
      /* #345bc3 and #752afc both sink into near-black — the seam blue and the
         wordmark lift, matching index.html's dark --brand */
      --blue-ink: #7f9dff;
      --fail: #ef7a70;
      --logo: #a97bff;
      --brand: #a97bff;
      --brand-hover: #c3a4ff;

      /* Diagram ink inverts with the canvas it is drawn on */
      --dia-box: rgba(255, 255, 255, 0.22);
      --dia-ink: rgba(255, 255, 255, 0.62);
      --dia-dot: rgba(255, 255, 255, 0.09);

      --shadow-note:   0 10px 20px -10px rgba(0, 0, 0, 0.8);
      --shadow-pill:   0 18px 44px -8px rgba(0, 0, 0, 0.72), 0 2px 8px rgba(0, 0, 0, 0.5);
      --shadow-drawer: -18px 0 56px rgba(0, 0, 0, 0.5);
      --shadow-pop:    0 28px 72px rgba(0, 0, 0, 0.65), 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background: var(--bg);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: var(--body1);
      line-height: 1.75;
      letter-spacing: 0;
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: calc(var(--content) + var(--gutter) * 2);
      margin: 0 auto;
      padding: 0 var(--gutter);
    }

    main, footer { position: relative; z-index: 1; }
    /* The workflow track bleeds past the column by design &mdash; clip it
       here rather than letting the page scroll sideways. */
    main { overflow-x: clip; }

    /* ---------- NAV ---------- */
    /* Only the wordmark leaves the column, and that is a correction (Ritika,
       2026-08-23: "undo the left and rifght corner adjustment i only meant it
       for the logo"). The first pass widened the whole bar
       (`header > .wrap { max-width: none; padding: 0 32px }`), which moved both
       ends of it: the mark went out to the page edge and the theme switch went
       out with it. The bar is back on the --content column with every other
       element on the page, and the mark alone breaks out to the 32px page inset
       &mdash; the same inset .index and .case-rail are parked at, so on the two case
       studies the mark and the chapter rail still share a left edge.

       Absolute rather than a negative margin, because the distance from the page
       edge to the column changes with the viewport and there is no static offset
       to write; `header` is sticky, which is what makes it the containing block.
       Taking the mark out of flow leaves .nav's space-between with a single item
       on index.html, which would drift to flex-start &mdash; hence margin-left: auto
       on .nav-links. The case shells still have two children (.nav-left and
       .nav-right) so that line is inert there; it is carried in all three files
       anyway, because this block stays identical across them.

       Scoped above 800px, which is where the wrap first has margin to break out
       of. Below it the column already reaches the page edge, so the mark simply
       stays in flow and needs no phone override. */
    @media (min-width: 800px) {
      .nav-name { position: absolute; left: 32px; top: 50%; translate: 0 -50%; }
      .nav > .nav-links { margin-left: auto; }
    }

    header {
      position: sticky; top: 0; z-index: 60;
      background: var(--bg);
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }
    header.scrolled { border-bottom-color: var(--line); }
    .nav {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 22px 0;
      gap: 24px;
      font-size: var(--body2); line-height: 24px;
    }
    .nav-name { font-weight: 500; color: var(--text); }
    /* "riri" wordmark — hand-drawn monoline SVG, colored via currentColor */
    .riri-logo {
      display: block; height: 28px; width: auto;
      color: var(--logo);
      transition: scale 0.18s ease;
    }
    .nav-name:hover .riri-logo { scale: 1.05; }
    /* the cat in the second i swishes its tail on hover — a `d` morph where
       supported, a rotate-from-the-base wag everywhere else */
    .riri-tail { transform-box: fill-box; transform-origin: 0% 0%; }
    @keyframes riri-tail-wag {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-10deg); }
      65% { transform: rotate(7deg); }
    }
    @keyframes riri-tail-wave {
      0%, 100% { d: path("M129 51 C138 58 143 52 148 56 C152 59 153 63 158 61"); }
      30% { d: path("M129 51 C138 57 144 50 149 53 C153 55 155 56 160 52"); }
      65% { d: path("M129 51 C138 59 143 54 148 59 C152 62 153 65 157 63"); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .nav-name:hover .riri-tail,
      .nav-name:focus-visible .riri-tail { animation: riri-tail-wag 1s ease-in-out infinite; }
      @supports (d: path("M0 0")) {
        .nav-name:hover .riri-tail,
        .nav-name:focus-visible .riri-tail { animation-name: riri-tail-wave; }
      }
    }
    .nav-left { display: flex; align-items: center; gap: 20px; }
    /* A circular icon button, not a text link (Ritika, 2026-08-23, from a
       reference: a filled circle holding a return arrow). 36px is the circle
       the site already owns (.shelf-nav, .wf-nav); the arrow is the monoline
       stroke idiom every drawn glyph here uses. Icon-only, so the accessible
       name rides on the link (aria-label + title), same rule as the footer
       marks. Kept identical in finsynth.html and case.html. */
    .nav-back {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      border-radius: 999px;
      background: var(--bg-raised);
      color: var(--muted);
      transition: color 0.18s ease, scale 0.15s ease-out;
    }
    .nav-back:hover { color: var(--text); }
    .nav-back:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .nav-back:active { scale: 0.94; }
    .nav-back svg { display: block; width: 18px; height: 18px; }
    .nav-right { display: flex; align-items: center; gap: 14px; }

    /* Light / dark switch &mdash; a switch pill, not a standalone icon button
       (Ritika, 2026-08-23: "Add a switch pill instead of a standalone"). The
       icon button said nothing about state: one glyph, and you had to know that
       the sun meant "you are in light" rather than "click for light". A pill
       shows both ends of the choice at once and puts the knob under the one you
       are in, so the state is visible without reading the label.

       The knob rides UNDER the two glyphs (z-index, not order), which is what
       makes the mark sitting on it the theme you're in and the mark beside it
       the theme you'd get. It moves on `translate` alone &mdash; compositor-only, so
       a theme flip can never reflow the header. Colors deliberately do not
       transition anywhere on this site (a color transition collides with the
       chat squeeze), so only the knob's travel and the border animate.
       Kept identical in index.html, finsynth.html and case.html. */
    .theme-switch {
      position: relative;
      display: inline-flex; align-items: center;
      width: 56px; height: 30px; padding: 0;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--switch-track);
      cursor: pointer;
      -webkit-appearance: none; appearance: none;
      transition: border-color 0.18s ease, scale 0.15s ease-out;
    }
    .theme-switch:hover, .theme-switch:focus-visible { border-color: var(--line-hover); }
    .theme-switch:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .theme-switch:active { scale: 0.96; }
    .theme-switch-knob {
      position: absolute; top: 2px; left: 2px;
      width: 24px; height: 24px; border-radius: 999px;
      background: var(--switch-knob);
      box-shadow: 0 1px 2px rgba(16, 16, 19, 0.16);
      transition: translate 0.24s cubic-bezier(.22, .61, .36, 1);
    }
    :root[data-theme="dark"] .theme-switch-knob { translate: 26px 0; }
    .theme-switch svg {
      position: relative; z-index: 1;
      flex: 0 0 auto;
      display: block; width: 15px; height: 15px;
      color: var(--faint);
    }
    .theme-switch .ico-sun { margin-left: 6.5px; }
    .theme-switch .ico-moon { margin-left: auto; margin-right: 6.5px; }
    /* the glyph the knob is parked on is the live theme, so it takes the ink */
    :root[data-theme="light"] .theme-switch .ico-sun,
    :root[data-theme="dark"] .theme-switch .ico-moon { color: var(--text); }
    @media (prefers-reduced-motion: reduce) {
      .theme-switch-knob { transition: none; }
    }

    /* Narrow screens: back/next earn the space; the masthead carries identity */
    @media (max-width: 560px) {
      .nav-name { display: none; }
    }

    /* ---------- CHAPTER RAIL ----------
       finsynth.html indexes its chapters with a labelled rail in the left
       margin; this page gets ticks instead (Ritika, 2026-08-22, from a
       reference she pointed at): one hairline dash per chapter down the right,
       the current one inked and at full length. Ticks and not labels because a
       short case study's chapter names are two words each — a 168px labelled
       list beside a 660px column would out-weigh the thing it indexes, and all
       this rail has to say is how far along you are. Note it is NOT the
       per-chapter tick that finsynth tried and reverted: there the ticks
       replaced a labelled rail that was working, here they are the only rail
       the page has ever had.

       Parked at a fixed inset from the window edge like .index, not tracked off
       the content column, so it stays put while the column recentres. Vertically
       centred rather than pinned under the header: with no labels there is no
       reading order to line up with the masthead, and centred it reads as a
       position gauge. Hidden below 1024px — a lower bar than finsynth's 1120px
       because 34px of tick needs far less margin than 168px of label. */
    .case-rail {
      position: fixed;
      top: 50%;
      right: 32px;
      transform: translateY(-50%);
      z-index: 50;
      opacity: 0;
      transition: opacity 0.5s ease 0.2s;
    }
    .case-rail.ready { opacity: 1; }
    .case-rail ol { list-style: none; }
    .case-rail a { display: block; padding: 7px 0; }
    .case-rail a:focus-visible { outline: none; }
    /* The bar keeps one box in every state and only ever scales, so a chapter
       change stays on the compositor and can never reflow the rail. scaleY(.5)
       on a 2px bar lands on a crisp 1px, and the right-hand origin makes the
       active tick grow leftward, away from the page edge — the same direction
       the reference grows in. */
    .case-rail i {
      display: block;
      width: 34px; height: 2px;
      border-radius: 1px;
      background: var(--line-hover);
      transform: scaleX(0.6) scaleY(0.5);
      transform-origin: 100% 50%;
      transition: transform 0.28s cubic-bezier(0.22,0.61,0.36,1), background 0.22s ease;
    }
    .case-rail a:hover i { background: var(--faint); transform: scaleX(0.8) scaleY(0.5); }
    .case-rail a:focus-visible i { background: var(--text); transform: scaleX(0.8) scaleY(1); }
    .case-rail a[aria-current='true'] i { background: var(--text); transform: none; }
    /* The drawer owns the right edge in pane mode, and below 1100px it owns it
       at any width, so the rail steps aside whenever the chat is docked. A
       popped-out window floats anywhere, so it leaves the rail alone. */
    body.chat-open:not(.chat-popped) .case-rail {
      opacity: 0; pointer-events: none; transition-delay: 0s;
    }
    /* Same as finsynth's rail: the state change is the information, the
       easing is decoration, so reduced motion keeps the ticks and drops
       the movement (and the fade-in, which would otherwise be the one
       animated thing left on the page). */
    @media (prefers-reduced-motion: reduce) {
      .case-rail, .case-rail i { transition: none; }
    }
    @media (max-width: 1023px) { .case-rail { display: none; } }

    /* ---------- MASTHEAD ---------- */
    /* Section 01 is the orientation beat and reads in one rhythm:
       what is it -> see it -> why it matters. The product screen is the
       hero visual, so the ground stays quiet and warm and the page only
       gets more expressive from Section 02 on. */
    .masthead { padding: 80px 0 92px; }
    .eyebrow {
      font-size: var(--body2); line-height: 22px;
      color: var(--faint); font-weight: 500;
      margin-bottom: 18px;
    }
    .masthead h1 {
      font-size: var(--h1);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.022em; /* em, not px — the size is fluid */
      text-wrap: balance;
      color: var(--text);
      margin-bottom: 20px;
    }
    /* Stepped from --h3 to --body1 with finsynth.html, which is the reference
       implementation of this shell — see the note on .standfirst there. The
       standfirst is a description, not a second headline; the distinction from
       the body copy is carried by ink, not by a size. */
    .standfirst {
      font-size: var(--body1); line-height: var(--body1-lh);
      color: var(--muted);
      max-width: 54ch;
      text-wrap: pretty;
    }
    .masthead-meta {
      font-size: var(--body2); line-height: 22px;
      color: var(--faint); font-weight: 500;
      margin-top: 26px;
    }


    /* ---------- CHAPTERS ---------- */
    /* No rules, no labels, no numbered sections — rhythm carries the reader. */
    /* ---- SECTION SEPARATOR ----
       Kept identical to finsynth.html — see the long note there for why it is
       keyed on the numbered tag rather than on `.chapter`. Here every chapter
       is top level and every one gets a pill, so the selector simply matches
       them all; `.credits` is carried for shell parity and matches nothing,
       this page having no Team block.

       The renderer emits `<div class="wrap"><section class="chapter">` — wrap
       OUTSIDE section, matching finsynth. It used to be the other way round,
       and it was flipped for this rule: with the wrap inside, the border drew
       on the section and spanned the full page width instead of the 660px
       column, landing 24px past the text on each side. Flipping it also makes
       the two shells structurally the same, which is the standing rule for
       anything in here. Nothing else in this file couples `.chapter` to
       `.wrap`, so the flip was isolated. */
    .credits,
    section:has(> .chapter-head > .chapter-num) {
      border-top: 1px solid var(--line);
      margin-top: 40px;
    }

    .chapter { padding: 56px 0 0; scroll-margin-top: 76px; }

    p { margin-bottom: 22px; }
    p:last-child { margin-bottom: 0; }
    i { font-style: italic; }

    h2 {
      font-size: var(--h2); line-height: var(--h2-lh);
      font-weight: 500; letter-spacing: -0.5px;
      text-wrap: balance;
      color: var(--text);
      margin-bottom: 26px;
    }

    /* A line that gets its own air, not a heading */
    .beat { margin-bottom: 0; }

    .pull {
      font-size: clamp(var(--h3), 5.2vw, var(--h2));
      line-height: 1.3;
      letter-spacing: -0.024em; /* em, not px — the size is fluid */
      font-weight: 500;
      text-wrap: balance;
      color: var(--text);
      margin: 56px 0;
    }

    /* The moment of noticing — set as dialogue, not as another paragraph */
    .voice { margin: 46px 0 46px 28px; }
    .voice p {
      font-size: 19px; line-height: 1.9;
      margin: 0; color: var(--text);
      letter-spacing: -0.2px;
    }
    .voice p.turn { margin-top: 22px; }


    /* ---------- CHAPTER HEADS ----------
       The number is the map's promise being kept. The name is compelling
       rather than procedural; the gloss says what the reader is about to
       get, so no chapter has to be read to find out whether it matters.

       Three levels, not four. The gloss used to be *smaller* than the body
       copy that followed it (15px muted over 17px ink), so a line that
       summarises the chapter read as a caption demoted beneath the thing it
       summarises — the head stacked four type sizes in its first four lines.
       The gloss is now a lede: body size, separated from the body by ink
       alone. Colour is the whole hierarchy below the h2, which is the
       monochrome way and leaves the head one clear block instead of a pile. */
    /* ---- SECTION GRAMMAR: context -> image -> interpretation ----
       Locked 2026-08-22. Every section runs in this order, and the order is
       the rule, not a preference:

         tag -> title -> lede        only why you are about to see this
         [figure]                    let the reader see it
         figcaption                  what you are looking at
         .chapter-key                why it matters (optional)
         body                        the deeper reasoning, only if needed

       Copy that explains a figure NEVER sits above it. The failure this
       replaces was context -> interpretation -> image -> interpretation ->
       another interpretation, which made the page unscannable: the reader was
       told what to think twice before being shown anything. The product
       screenshots carry a lot of the story here, so they come early and the
       reasoning follows them.

       This file's renderer emits only the tag and the title today — no CASES
       entry carries a lede or a key yet. The rest is here so the two copies of
       the shell stay identical, and so the grammar is already in place the day
       a short case study grows a figure. */
    .chapter-head { margin-bottom: 32px; }
    /* The number is a tag, not a line of text: bounded, so label and title
       bind into one object instead of reading as two stacked lines. Hairline
       and monochrome — the pill is the shape, not a fill. Only top-level
       chapters get it; .decision-num inside 07 stays a bare label, which is
       what marks it as the nested level. */
    .chapter-num {
      display: inline-block;
      font-family: var(--mono); font-size: var(--pill);
      line-height: 1;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 11px 5px;
      margin-bottom: 18px;
    }
    .chapter-head h2 {
      font-size: var(--h2);
      letter-spacing: -0.7px;
      /* A lede paragraph needs more air under a 32px head than a caption did */
      margin-bottom: 16px;
    }
    /* ...but a head with no lede shouldn't carry the lede's air */
    .chapter-head h2:last-child { margin-bottom: 0; }
    .chapter-gloss {
      font-size: var(--body1); line-height: 1.75;
      color: var(--muted);
      text-wrap: pretty;
      margin-bottom: 0;
    }
    /* The chapter's one point. It sits AFTER the figure,
       never before it — see the section grammar note above .chapter-head.
       Lede is muted, key is ink: the two sit at the same size and the
       hierarchy is carried by colour and weight alone, which is how this
       page keeps four levels without four type sizes. Every key line was
       MOVED out of the body it used to sit in — the chapter gains nothing it
       didn't already say. Chapters that already resolve on their own terms
       (04's .pull, 08's .beat) don't get one. */
    /* The tinted panel, restored 2026-08-23 (Ritika, on 02's key in finsynth:
       "you miss understood the div covering these.. restore it. for all where
       ever it existed unless specifically asked to remove"). It had been
       stripped to a bare label-and-line here for a few hours, on two same-day
       notes she had left on two of finsynth's keys — "no need to keep it in. a
       div" and "no need it to be in div" — read as a verdict on the pattern.
       They were about those two placements. "Where ever it existed" covers the
       shared shell, so the panel is back in both files. The two placements she
       named have since stopped being keys at all -- 04's line is body prose
       and the turning point is deleted -- so finsynth draws the panel on every
       key it still has, and there is no opt-out left to mirror.

       Ground is --pain-bg, the violet tint finsynth settled on, and adding the
       token here is what finally ends the --pain-bg / --bg-raised drift on
       this rule: the two files now draw the same panel on the same ground.
       .nav-back above is the one rule still holding --bg-raised where finsynth
       holds --pain-bg — a visible control she has not spoken about, so it is
       left for her rather than reconciled quietly.

       This file's renderer emits no key today (no CASES entry carries one), so
       nothing here renders — it is carried for shell parity, which is exactly
       why it must not be left holding a treatment finsynth no longer draws. */
    .chapter-key {
      margin: 30px 0;
      padding: 22px 24px;
      border-radius: 14px;
      background: var(--pain-bg);
    }
    /* `.chapter-key.plain` was carried here for a few hours, for parity with
       an un-tinted variant finsynth used on two keys. Both of those stopped
       being keys the same day (04's is body prose, the turning point is
       deleted), the variant went with them, and so did this copy. Parity is
       the panel and nothing else. */
    .chapter-key .k {
      display: block;
      font-family: var(--mono); font-size: var(--pill);
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .chapter-key p {
      font-size: var(--body1); line-height: 1.6;
      font-weight: 500;
      color: var(--text);
      text-wrap: pretty;
      margin-bottom: 0;
    }
    @media (max-width: 560px) {
      /* 24px of padding either side is 48px off a phone measure. */
      .chapter-key { padding: 18px 18px; border-radius: 12px; }
    }


    /* ---------- CASE BODY ----------
       The five short case studies share one shape: masthead, then numbered
       chapters of prose or a short list, then an optional outward link.
       Everything above this comment is finsynth.html's shell, unchanged. */
    .case-list { list-style: none; margin: 0 0 22px; }
    .case-list:last-child { margin-bottom: 0; }
    .case-list li {
      position: relative;
      padding-left: 22px;
      margin-bottom: 14px;
      color: var(--text);
      text-wrap: pretty;
    }
    .case-list li:last-child { margin-bottom: 0; }
    /* A hairline dash, not a bullet — the page has no other dots on it */
    .case-list li::before {
      content: '';
      position: absolute; left: 0; top: 14px;
      width: 10px; height: 1px;
      background: var(--faint);
    }

    .case-cta { padding: 40px 0 0; }
    .case-cta a {
      display: inline-block;
      font-size: var(--body2); line-height: 24px;
      color: var(--text);
      border-bottom: 1px solid var(--line);
      padding-bottom: 3px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .case-cta a:hover { border-bottom-color: var(--text); }

    /* Shown only if the page is opened without a readable case key */
    .case-miss { padding: 96px 0; }
    .case-miss a { border-bottom: 1px solid var(--line); }

    /* ---------- CLOSE ---------- */
    .close { padding: 56px 0 0; scroll-margin-top: 76px; }
    .close p { color: var(--text); }

    footer {
      border-top: 1px solid var(--line);
      margin-top: 96px;
      padding: 48px 0 64px;
    }
    .footer-row {
      display: flex; flex-wrap: wrap; gap: 12px;
      align-items: baseline; justify-content: space-between;
      font-size: var(--body2); line-height: 24px;
    }
    .footer-row a { color: var(--muted); transition: color 0.18s ease; }
    .footer-row a:hover { color: var(--text); }
    .footer-copy { font-size: var(--body2); color: var(--faint); }

    /* ---------- REVEAL ---------- */
    .reveal {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s cubic-bezier(0.16,1,0.3,1), transform 0.6s cubic-bezier(0.16,1,0.3,1);
    }
    .reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { opacity: 1; transform: none; transition: none; }
      .tc-spin, .tc-run { animation: none; }
    }

    @media (max-width: 560px) {
      .masthead { padding: 56px 0 68px; }
      .mat { --mat-pad: 18px; border-radius: 14px; }
      .hero-product { --mat-pad: 20px; margin-top: 40px; }
      .masthead .pull { margin-top: 44px; max-width: none; }
      .chapter, .close { padding-top: 44px; }
      .credits,
      section:has(> .chapter-head > .chapter-num) { margin-top: 28px; }
      .voice { margin-left: 0; }
      .voice p { font-size: 18px; line-height: 1.85; }
    }

    /* ---------- ASK-ME CHAT ----------
       Mirrored from index.html's case-overlay chat — keep the two in sync
       if the interaction changes. Here the pill floats on the page itself. */
    .ask-pill {
      position: fixed; left: 50%; bottom: 20px; z-index: 70;
      translate: -50% 0;
      display: flex; align-items: center; gap: 10px;
      /* 400px, down from 520 (Ritika, 2026-08-23: "reduce the width").
         520 was width the label was not using: it sat in 415px of box for
         188px of type. 400 leaves ~107px of slack, so the label still never
         ellipses and the box still reads as an input rather than as a
         shrink-wrapped button, which is the one thing its width has to say.
         Below the mobile query it goes full-width regardless, so nothing
         there changes. Both chat pages carry the same number. */
      width: min(400px, calc(100vw - 32px));
      padding: 9px 9px 9px 10px;
      background: var(--ask-pill-bg);
      border: 1px solid var(--line-hover); border-radius: 999px;
      box-shadow: var(--shadow-pill);
      font: inherit; font-size: var(--body2); line-height: 22px; font-weight: 500;
      color: var(--text);
      text-align: left;
      cursor: text; /* reads as an input; clicking opens the real one */
      transition: color 0.18s ease, border-color 0.18s ease, opacity 0.25s ease, scale 0.15s ease-out;
    }
    .ask-pill:hover { border-color: var(--glow-strong); }
    .ask-pill:active { scale: 0.98; }
    .ask-pill:focus-visible { outline: 2px solid var(--glow-ink); outline-offset: 3px; }

    /* First-visit attract: the pill is easy to read past, so on a reader's
       first landing (and only if they have never opened the chat) its border
       breathes in site purple three times and pings one expanding ring. Drawn
       on pseudo-elements so the resting hairline border is untouched; both are
       out of flow, so they are not flex items of the pill. */
    .ask-pill::before, .ask-pill::after {
      content: ''; position: absolute; inset: -1px;
      border-radius: 999px; pointer-events: none;
      border: 2px solid transparent;
    }
    .ask-pill::after { opacity: 0; }
    .ask-pill.attract::before { animation: ask-breathe 2.2s ease-in-out 3; }
    .ask-pill.attract::after { animation: ask-ping 2.2s ease-out 3; }
    .ask-pill.attract .ask-pill-send { animation: ask-send-glow 2.2s ease-in-out 3; }
    @keyframes ask-breathe {
      0%, 100% { border-color: transparent; box-shadow: 0 0 0 0 transparent; }
      42%      { border-color: var(--glow-strong);
                 box-shadow: 0 0 0 4px var(--glow-soft), 0 0 34px 8px var(--glow-soft); }
    }
    @keyframes ask-ping {
      0%       { opacity: 1; box-shadow: 0 0 0 0 var(--glow-strong); }
      60%, 100% { opacity: 0; box-shadow: 0 0 0 20px var(--glow-strong); }
    }
    @keyframes ask-send-glow {
      0%, 100% { background: var(--text); }
      42%      { background: var(--glow-ink); }
    }
    .ask-pill .ask-avatar { width: 32px; height: 32px; font-size: 13px; }
    .ask-pill-send {
      flex: none; width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--text); color: var(--bg);
    }
    .ask-pill-send svg { width: 14px; height: 14px; }
    body.chat-open .ask-pill { opacity: 0; pointer-events: none; }
    .ask-avatar {
      flex: none; width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--text); color: var(--bg);
      font-size: 12px; font-weight: 500; line-height: 1;
    }
    .ask-pill-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .ask-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 80;
      width: min(var(--ask-w, 360px), 100vw);
      display: flex; flex-direction: column;
      background: var(--bg-float);
      border-left: 1px solid var(--line);
      box-shadow: var(--shadow-drawer);
      transform: translateX(calc(100% + 24px));
      visibility: hidden;
      transition: transform 0.4s cubic-bezier(.22,.61,.36,1), visibility 0s 0.4s;
    }
    .ask-drawer.in {
      transform: none; visibility: visible;
      transition: transform 0.4s cubic-bezier(.22,.61,.36,1);
    }
    /* Drag handle on the drawer's left edge — width lives in --ask-w so the
       page squeeze below tracks it 1:1. Pointer-only affordance; keyboard
       users resize with arrow keys on the focused separator. */
    .ask-resize {
      position: absolute; top: 0; bottom: 0; left: -5px; width: 10px;
      cursor: ew-resize; touch-action: none; z-index: 2;
    }
    .ask-resize::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px;
      background: var(--text); opacity: 0;
      transition: opacity 0.18s ease;
    }
    .ask-resize:hover::after, .ask-resize:focus-visible::after,
    body.ask-dragging .ask-resize::after { opacity: 0.22; }
    .ask-resize:focus-visible { outline: none; }
    /* The popped window clips overflow for its rounded corners, so the
       handle tucks fully inside its left edge there. */
    .ask-drawer.pop .ask-resize { left: 0; }
    .ask-drawer.pop .ask-resize::after { left: 0; }
    /* Popped out: a floating chat window, Zoom-style. Positioned by
       --ask-x/--ask-y (set from JS), dragged by its header. */
    .ask-drawer.pop {
      top: var(--ask-y, 24px); left: var(--ask-x, calc(100vw - 400px));
      right: auto; bottom: auto;
      height: min(600px, calc(100vh - 48px));
      border: 1px solid var(--line); border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-pop);
      transform: none;
      opacity: 0; scale: 0.98;
      transition: opacity 0.25s ease, scale 0.25s ease, visibility 0s 0.25s;
    }
    .ask-drawer.pop.in {
      opacity: 1; scale: 1;
      transition: opacity 0.25s ease, scale 0.25s ease;
    }
    .ask-drawer.pop .ask-head { cursor: grab; user-select: none; touch-action: none; }
    body.ask-dragging .ask-drawer.pop .ask-head { cursor: grabbing; }
    /* No page squeeze while transitions are killed mid-drag */
    body.ask-dragging, body.ask-dragging .ask-drawer { transition: none !important; }
    .ask-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 0;
    }
    .ask-head .ask-avatar { width: 28px; height: 28px; }
    .ask-head-actions { display: flex; align-items: center; gap: 4px; }
    .ask-head-close, .ask-head-pop {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid transparent; border-radius: 8px;
      background: transparent; color: var(--faint);
      font: inherit; font-size: var(--body1); line-height: 1; cursor: pointer;
      transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease, scale 0.15s ease-out;
    }
    .ask-head-close:hover, .ask-head-pop:hover { color: var(--text); background: var(--bg-raised); border-color: var(--line); }
    .ask-head-close:active, .ask-head-pop:active { scale: 0.96; }
    .ask-head-pop svg { width: 14px; height: 14px; display: block; }
    .ask-head-pop .ico-dock { display: none; }
    .ask-drawer.pop .ask-head-pop .ico-dock { display: block; }
    .ask-drawer.pop .ask-head-pop .ico-pop { display: none; }
    .ask-note {
      padding: 10px 16px 12px;
      border-bottom: 1px solid var(--line);
      font-size: var(--body2); line-height: 18px; color: var(--faint);
    }
    .ask-log {
      flex: 1; overflow-y: auto; overscroll-behavior: contain;
      display: flex; flex-direction: column; gap: 16px;
      padding: 18px 16px;
    }
    .ask-msg-user {
      align-self: flex-end; max-width: 85%;
      background: var(--bg-raised); color: var(--text);
      padding: 8px 14px; border-radius: 16px 16px 4px 16px;
      font-size: var(--body2); line-height: 20px;
    }
    .ask-msg-a { display: flex; gap: 10px; }
    .ask-msg-a .ask-avatar { width: 22px; height: 22px; font-size: 10px; margin-top: 1px; }
    .ask-msg-body { min-width: 0; font-size: var(--body2); line-height: 21px; color: var(--muted); }
    .ask-msg-body p + p { margin-top: 10px; }
    .ask-typing { display: flex; gap: 4px; padding: 6px 0; }
    .ask-typing span {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--faint);
      animation: askDot 1.1s ease-in-out infinite;
    }
    .ask-typing span:nth-child(2) { animation-delay: 0.18s; }
    .ask-typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes askDot {
      0%, 60%, 100% { opacity: 0.35; transform: none; }
      30% { opacity: 1; transform: translateY(-2px); }
    }
    /* Chips and the input are one unit: the composer owns the hairline that
       used to sit on the form, so the suggestions read as part of the thing
       you type into rather than as a band floating above it. */
    .ask-composer { border-top: 1px solid var(--line); }
    .ask-chips {
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      padding: 12px 16px 4px;
    }
    /* Nothing to suggest, no band: an empty box would leave a stray gap
       inside the composer while the intro is still streaming. */
    .ask-chips:empty { display: none; }
    .ask-chip {
      max-width: 100%;
      background: var(--bg-float); border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 14px;
      font: inherit; font-size: var(--body2); line-height: 20px; color: var(--muted);
      text-align: right; cursor: pointer;
      transition: color 0.18s ease, background 0.18s ease, scale 0.15s ease-out,
                  opacity 0.3s ease, translate 0.3s ease;
    }
    .ask-chip:hover { color: var(--text); background: var(--bg-raised); }
    .ask-chip:active { scale: 0.97; }
    .ask-chip.pre { opacity: 0; translate: 0 6px; }
    .ask-form {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px 10px 16px;
    }
    /* Follow-ups hang off the answer that raised them, inside its own text
       column, so they read as this answer's next step. Left-aligned, which is
       what separates them from the composer's right-aligned suggestions. */
    .ask-follow {
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
      margin-top: 12px;
    }
    .ask-follow .ask-chip { text-align: left; }
    .ask-input {
      flex: 1; min-width: 0;
      border: 0; background: transparent; outline: none;
      font: inherit; font-size: var(--body2); line-height: 22px; color: var(--text);
    }
    .ask-input::placeholder { color: var(--faint); }
    .ask-send {
      flex: none; width: 30px; height: 30px;
      border: 1px solid var(--line); border-radius: 50%;
      background: var(--bg-float); color: var(--muted);
      font: inherit; font-size: var(--body2); line-height: 1; cursor: pointer;
      transition: color 0.18s ease, background 0.18s ease, scale 0.15s ease-out;
    }
    .ask-send:hover { color: var(--text); background: var(--bg-raised); }
    .ask-send:active { scale: 0.94; }
    .ask-sr {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap;
    }
    /* Wide screens: the page slides left to make room, like the reference.
       The squeezed column collides with the fixed section rail below ~1440px,
       so the rail steps aside while the chat is open. */
    @media (min-width: 1100px) {
      body { transition: padding-right 0.4s cubic-bezier(.22,.61,.36,1); }
      /* Pane mode only — a popped-out window floats over the page instead */
      body.chat-open:not(.chat-popped) { padding-right: var(--ask-w, 360px); }
      body.chat-open:not(.chat-popped) .index { opacity: 0; pointer-events: none; transition-delay: 0s; }
      /* …but it peeks back in when the cursor visits its home corner
         (.rail-peek is set by the ask script's mousemove hotspot). The flat
         page-colored halo keeps it legible when the squeezed column has
         slid underneath it. */
      body.chat-open:not(.chat-popped).rail-peek .index {
        opacity: 1;
        pointer-events: auto;
        background: var(--bg);
        box-shadow: 0 0 0 14px var(--bg);
      }
      /* The squeezed column also steps its scale down (zoom re-lays out, unlike
         transform), so the page reads as fitting beside the pane rather than
         being cramped by it. --ask-zoom comes from applyPane(): it shrinks as
         the pane widens so the column always fits in the space that's left. */
      body.chat-open:not(.chat-popped) main,
      body.chat-open:not(.chat-popped) footer { zoom: var(--ask-zoom, 0.85); }
    }
    /* Resize + pop-out need room to be useful; below this the drawer just
       takes the viewport, so hide both affordances. */
    @media (max-width: 699px) {
      .ask-resize, .ask-head-pop { display: none; }
    }
    @media (max-width: 560px) {
      .ask-pill { bottom: 12px; width: calc(100vw - 24px); }
      .ask-drawer { width: 100vw; border-left: 0; }
      .ask-input { font-size: 16px; } /* under 16px iOS zooms the field on focus */
    }
    @media (prefers-reduced-motion: reduce) {
      .ask-drawer, .ask-drawer.in, .ask-drawer.pop, .ask-drawer.pop.in, body, .ask-chip { transition: none; }
      .ask-typing span { animation: none; }
      .ask-pill.attract::before, .ask-pill.attract::after,
      .ask-pill.attract .ask-pill-send { animation: none; }
      .ask-pill.attract::before { border-color: var(--glow-strong); }
      .ask-chip.pre { opacity: 1; translate: none; }
    }
  </style>
</head>

  <header id="siteHeader">
    <div class="wrap">
      <nav class="nav">

  <script>
  // ——— Light / dark theme ———
  // The head script already picked the theme; this wires the switch, keeps the
  // address-bar colour in step, and follows the OS while no choice is stored.
  // Same key as index.html, so a choice made on either page holds on both.
  (function() {
    var root = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var meta = document.querySelector('meta[name="theme-color"]');
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function stored() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
    function apply(t) {
      root.setAttribute('data-theme', t);
      if (meta) meta.setAttribute('content', t === 'dark' ? '#101013' : '#fcfcfc');
      if (btn) {
        // role="switch": aria-checked is "dark is on", the accessible name is
        // fixed ("Dark theme"), and the tooltip names the theme you'd get.
        btn.setAttribute('aria-checked', t === 'dark' ? 'true' : 'false');
        btn.setAttribute('title', 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' theme');
      }
    }
    apply(stored() === 'light' || stored() === 'dark' ? stored() : (mq.matches ? 'dark' : 'light'));
    mq.addEventListener('change', function(e) {
      if (stored() !== 'light' && stored() !== 'dark') apply(e.matches ? 'dark' : 'light');
    });
    if (btn) btn.addEventListener('click', function() {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('theme', next); } catch (e) {}
      apply(next);
    });
  })();

  // ——— Header hairline on scroll ———
  (function() {
    var header = document.getElementById('siteHeader');
    function sync() {
      header.classList.toggle('scrolled', window.scrollY > 8);
    }
    sync();
    window.addEventListener('scroll', sync, { passive: true });
    window.addEventListener('resize', sync, { passive: true });
  })();

  // ——— Case studies ———
  // One page, one case. The key comes from ?c= (or #key), the content from the
  // CASES object below, rendered in finsynth.html's format.
  //
  // It used to hold five, chained together by a Next link in the header, and
  // that whole apparatus was removed on purpose (Ritika, 2026-08-22): Next was
  // the only route into scream / yomo / slyce, so the chain existed to surface
  // three thin pages nothing else pointed at, and clicking Next off the
  // FinSynth study dropped the reader into one of them. Mazic went with them —
  // its card and its Experience row link straight out to the Framer case study,
  // which is the canonical one. Event Beep is the only case with a card behind
  // it, so it is the only case left. Adding a second means adding its CASES
  // entry and a card that promises it — not a chain through the header.
  (function() {
    var CASES = {
      // FinSynth has no entry here — its row links straight to finsynth.html.
      eventbeep: {
        eyebrow: 'UI Design Intern · 2023',
        title: 'Event Beep',
        lead: 'A mobile app redesign for students, and a recruiter-facing dashboard built alongside it.',
        meta: ['Mobile', 'Dashboard', 'First design role'],
        sections: [
          { h: 'Context', p: ['Event Beep connected students with campus events and opportunities. The app had grown feature by feature until the navigation could not hold it, and recruiters had no interface of their own at all.'] },
          { h: 'What I worked on', list: [
            'Restructured the app around what students came back for, rather than what had shipped most recently.',
            'A visual refresh (type scale, spacing, components) that made the app feel like one product.',
            'A recruiter dashboard from scratch: posting, tracking applicants, and reading results.'
          ] },
          { h: 'What I learned', p: ['My first design role, and the one that taught me that most redesigns are really information-architecture problems wearing a visual-design costume.'] }
        ],
        qa: [
          { q: 'What did your first design role teach you?',
            k: ['learn', 'first', 'lesson'],
            f: ['Why restructure around what students came back for?',
                'What was the recruiter dashboard?'],
            a: ['That most redesigns are information-architecture problems wearing a visual-design costume. The app did not look broken; it had grown feature by feature until the navigation could not hold it.',
                'I went in expecting to push pixels and spent most of my time deciding what the app was actually organised around.'] },
          { q: 'Why restructure around what students came back for?',
            k: ['navigation', 'restructure', 'students'],
            f: ['What was the recruiter dashboard?',
                'What did your first design role teach you?'],
            a: ['The navigation had been organised by shipping order: whatever launched most recently got the space. Students did not think in release notes; they came back for events and opportunities.',
                'Restructuring around those return visits made the rest of the redesign mostly fall out on its own.'] },
          { q: 'What was the recruiter dashboard?',
            k: ['recruiter', 'dashboard'],
            f: ['Why restructure around what students came back for?',
                'What did your first design role teach you?'],
            a: ['Recruiters had no interface at all; they worked through the team behind the scenes. I designed their first one from scratch: posting, tracking applicants, reading results.',
                'Designing for a second audience inside the same product was the most useful thing I could have done in a first role.'] }
        ]
      }
    };

    // Questions matchable from typed input in any case study (never shown as chips)
    var GLOBAL_QA = [
      { q: 'How do I get in touch?',
        k: ['contact', 'email', 'hire', 'hiring', 'reach', 'available', 'chat', 'talk', 'connect'],
        a: ['The links in the site footer reach me directly; email is fastest.',
            'If it is about this project specifically, mention which part caught your eye and I will skip straight to the interesting bits.'] },
      { q: 'Who are you?',
        k: ['who', 'about', 'ritika', 'designer', 'background'],
        a: ['I am Ritika, a product designer working on AI and fintech interfaces, currently the founding designer at FinSynth.',
            'The About section on the main page has the longer version.'] }
    ];

    // Fallback when nothing matches a typed question
    var ASK_FALLBACK = ['Fair question, and past the edge of what I have written up here. This little chat runs on prepared answers, not a live model, so it only knows what I have told it.',
                        'For the real answer, the contact links in the footer reach the actual me.'];

    // Brief orientation before anything else — streamed on the very first
    // interaction (localStorage 'askIntroSeen', shared across the site),
    // rendered instantly after that so the log never opens empty.
    var ASK_INTRO = ['Hi, I’m the scripted version of Ritika. This chat is a quick way to interrogate this case study: I’ve written answers ahead of time to the questions it tends to raise.',
                     'Tap a suggestion below, or just type; if I don’t have an answer prepared, I’ll say so instead of making one up.'];

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function(ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
      });
    }

    // Mirrors the row order in index.html's #panel-work, which is what drives
    // the Next chain (finsynth → scream → mazic → yomo → slyce → eventbeep).
    // Reorder the rows there and this list has to follow.
                                                            // Framer site, so it is not
                                                            // a stop on the Next chain

    var main = document.getElementById('caseMain');
    var key = (new URLSearchParams(location.search).get('c')
      || location.hash.replace(/^#(case-)?/, '')).trim();
    var c = CASES[key];

    if (!c) {
      // A bad or missing key says so rather than silently bouncing — easier to
      // spot a broken link than a mystery redirect.
      main.innerHTML = '<div class="wrap case-miss"><h1>Case not found</h1>'
        + '<p style="margin-top:14px"><a href="index.html#work">&larr; Back to the work list</a></p></div>';
      document.title = 'Case not found \u00b7 Ritika Shakkerwal';
      return;
    }

    function chapterNum(i) { return (i < 9 ? '0' : '') + (i + 1); }

    (function renderCase() {
      var html = '<div class="wrap"><div class="masthead reveal">';
      if (c.eyebrow) html += '<p class="eyebrow">' + esc(c.eyebrow) + '</p>';
      html += '<h1>' + esc(c.title) + '</h1>';
      html += '<p class="standfirst">' + esc(c.lead) + '</p>';
      if (c.meta && c.meta.length) {
        html += '<p class="masthead-meta">' + c.meta.map(esc).join(' &middot; ') + '</p>';
      }
      html += '</div></div>';

      (c.sections || []).forEach(function(s, i) {
        html += '<div class="wrap"><section class="chapter reveal" id="ch-' + (i + 1) + '">'
          + '<div class="chapter-head"><span class="chapter-num">' + chapterNum(i) + '</span>'
          + '<h2>' + esc(s.h) + '</h2></div>';
        (s.p || []).forEach(function(p) { html += '<p>' + esc(p) + '</p>'; });
        if (s.list) {
          html += '<ul class="case-list">' + s.list.map(function(li) {
            return '<li>' + esc(li) + '</li>';
          }).join('') + '</ul>';
        }
        html += '</section></div>';
      });

      if (c.link) {
        var external = /^https?:/i.test(c.link.href);
        html += '<div class="wrap"><div class="case-cta reveal"><a href="' + esc(c.link.href) + '"'
          + (external ? ' target="_blank" rel="noopener"' : '') + '>' + esc(c.link.label) + '</a></div></div>';
      }

      main.innerHTML = html;
      document.title = c.title + ' \u00b7 Ritika Shakkerwal';
    })();

    // ——— Reveal on scroll ———
    // Runs after the render above, since the .reveal nodes only exist by then.
    (function() {
      var items = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window) ||
          window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        items.forEach(function(el) { el.classList.add('in'); });
        return;
      }
      var io = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            io.unobserve(entry.target);
          }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
      items.forEach(function(el) {
        // Content already on screen at load shouldn't animate in
        var r = el.getBoundingClientRect();
        if (r.top < window.innerHeight - 40 && r.bottom > 0) { el.classList.add('in'); return; }
        io.observe(el);
      });
    })();

    // ——— Chapter rail: build the ticks, then mark the one you are in ———
    // Runs after the render, since the chapters it indexes only exist by then.
    // The active test is the same one finsynth.html's labelled rail uses — the
    // last chapter whose top has crossed 42% of the viewport — so the two
    // shells agree on what "current chapter" means. A case with fewer than two
    // chapters gets no rail: one tick is not a position gauge, it's a dot.
    (function() {
      var rail = document.getElementById('caseRail');
      if (!rail) return;
      var targets = Array.prototype.slice.call(document.querySelectorAll('main .chapter[id]'));
      if (targets.length < 2) return;

      rail.innerHTML = '<ol>' + targets.map(function(sec) {
        var h = sec.querySelector('h2');
        var label = h ? h.textContent : sec.id;
        // Icon-only link, so the accessible name has to be supplied: aria-label
        // for assistive tech, title so hovering a tick says which chapter it is.
        return '<li><a href="#' + sec.id + '" title="' + esc(label) + '" aria-label="' + esc(label) + '"><i></i></a></li>';
      }).join('') + '</ol>';
      rail.hidden = false;

      var links = Array.prototype.slice.call(rail.querySelectorAll('a'));
      var current = -1;
      var ticking = false;

      function update() {
        ticking = false;
        var line = window.innerHeight * 0.42;
        var next = 0;
        for (var i = 0; i < targets.length; i++) {
          if (targets[i].getBoundingClientRect().top <= line) next = i;
        }
        // Bottom of the page: the last chapter is short, so pin it there.
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 4) {
          next = targets.length - 1;
        }
        if (next === current) return;
        if (current > -1) links[current].removeAttribute('aria-current');
        links[next].setAttribute('aria-current', 'true');
        current = next;
      }

      function onScroll() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(update);
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });
      update();
      window.requestAnimationFrame(function() { rail.classList.add('ready'); });
    })();

    // ——— Ask-me chat (floating pill + drawer) ———
    // Mirrored from finsynth.html — keep the two in sync if the interaction
    // changes. Scripted, not generated: this case's prepared Q&A plus
    // GLOBAL_QA, keyword-matched for typed questions; misses get ASK_FALLBACK.
    // Unlike finsynth.html there are no section-tagged chips — a case page has
    // no rail to follow, so the chips are just this case's own questions.
    var QA = (c.qa || []).concat(GLOBAL_QA);
    if (!(c.qa && c.qa.length)) return;   // no prepared answers, no pill

    var askPill = document.getElementById('askPill');
    var askDrawer = document.getElementById('askDrawer');
    var askLog = document.getElementById('askLog');
    var askChips = document.getElementById('askChips');
    var askForm = document.getElementById('askForm');
    var askInput = document.getElementById('askInput');
    var askLive = document.getElementById('askLive');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var ask = { seeds: c.qa.slice(), asked: [], busy: false, follow: [] };
    askPill.hidden = false;

    // Opening the drawer squeezes the page: right padding plus a `zoom` step
    // down on main/footer, which re-lays-out the document. Under an unchanged
    // scrollY that slides the reader out of the chapter they were reading, so
    // pin the current chapter in view across the mutation and correct scrollY
    // by however far it moved. The rail's aria-current is what says which one.
    function askKeepPlace(mutate) {
      var link = document.querySelector('.case-rail a[aria-current="true"]');
      var anchor = link ? document.getElementById(link.getAttribute('href').slice(1)) : null;
      if (!anchor) { mutate(); return; }
      var before = anchor.getBoundingClientRect().top;
      mutate();
      var after = anchor.getBoundingClientRect().top;
      // 'instant' rather than 'auto': 'auto' defers to the page's own
      // scroll-behavior, which is smooth, and turns the correction into a
      // long glide. A correction has to land in the same frame the layout
      // changed in, or the reader watches the page slide.
      if (after !== before) {
        window.scrollTo({ top: window.scrollY + (after - before), behavior: 'instant' });
      }
    }

    function askOpenDrawer(entry) {
      askAttractStop();
      askKeepPlace(function() { document.body.classList.add('chat-open'); });
      askDrawer.classList.add('in');
      if (entry) askQuestion(entry.q, entry);
      else {
        if (!askLog.childNodes.length) askIntro();
        if (window.matchMedia('(hover: hover)').matches) askInput.focus();
      }
    }

    function askCloseDrawer() {
      askDrawer.classList.remove('in');
      askKeepPlace(function() { document.body.classList.remove('chat-open'); });
      askPill.focus();
    }

    function scrollLog() { askLog.scrollTop = askLog.scrollHeight; }

    // Orientation message when the log is empty: streamed word-by-word the
    // very first time (across pages, via localStorage), instant after that.
    function askIntro() {
      var seen = false;
      try { seen = !!localStorage.getItem('askIntroSeen'); } catch (err) {}
      try { localStorage.setItem('askIntroSeen', '1'); } catch (err) {}
      if (seen) {
        var wrap = document.createElement('div');
        wrap.className = 'ask-msg-a';
        wrap.innerHTML = '<span class="ask-avatar" aria-hidden="true">R</span><div class="ask-msg-body">'
          + ASK_INTRO.map(function(p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
        askLog.appendChild(wrap);
        renderChips();
      } else {
        ask.busy = true;
        streamAnswer(ASK_INTRO, function() { ask.busy = false; renderChips(); });
      }
    }

    function askQuestion(text, entry) {
      if (ask.busy) return;
      ask.busy = true;
      entry = entry || matchQA(text);
      if (entry && ask.asked.indexOf(entry) < 0) ask.asked.push(entry);
      var u = document.createElement('div');
      u.className = 'ask-msg-user';
      u.textContent = text;
      askLog.appendChild(u);
      askChips.innerHTML = '';
      var typing = document.createElement('div');
      typing.className = 'ask-msg-a';
      typing.innerHTML = '<span class="ask-avatar" aria-hidden="true">R</span>'
        + '<div class="ask-typing"><span></span><span></span><span></span></div>';
      askLog.appendChild(typing);
      scrollLog();
      setTimeout(function() {
        typing.remove();
        streamAnswer(entry ? entry.a : ASK_FALLBACK, function(body) {
          ask.busy = false;
          renderFollow(entry, body);
          renderChips();
        });
      }, reduceMotion.matches ? 250 : 900);
    }

    function streamAnswer(paras, done) {
      var wrap = document.createElement('div');
      wrap.className = 'ask-msg-a';
      wrap.innerHTML = '<span class="ask-avatar" aria-hidden="true">R</span><div class="ask-msg-body"></div>';
      var msgBody = wrap.lastChild;
      askLog.appendChild(wrap);
      var finish = function() {
        askLive.textContent = paras.join(' ');
        scrollLog();
        done(msgBody);
      };
      if (reduceMotion.matches) {
        msgBody.innerHTML = paras.map(function(p) { return '<p>' + esc(p) + '</p>'; }).join('');
        finish();
        return;
      }
      var chunks = paras.map(function(p) {
        return { el: document.createElement('p'), words: p.split(' ') };
      });
      var pi = 0, wi = 0;
      (function tick() {
        var chunk = chunks[pi];
        if (!chunk) { finish(); return; }
        if (wi === 0) msgBody.appendChild(chunk.el);
        chunk.el.textContent += (wi ? ' ' : '') + chunk.words[wi];
        wi++;
        if (wi >= chunk.words.length) { pi++; wi = 0; }
        scrollLog();
        setTimeout(tick, 22 + Math.random() * 38);
      })();
    }

    // Where the answer leads: the entry's own `f` list, resolved by question
    // text so the data reads as prose rather than as indexes, minus anything
    // already asked. Two at most, and they are excluded from the composer's
    // chips below so the reader never sees one question offered twice.
    function renderFollow(entry, msgBody) {
      ask.follow = [];
      if (!entry || !entry.f || !msgBody) return;
      var picks = [];
      entry.f.forEach(function(q) {
        for (var i = 0; i < QA.length; i++) {
          var next = QA[i];
          if (next.q !== q || next === entry) continue;
          if (ask.asked.indexOf(next) < 0 && picks.indexOf(next) < 0) picks.push(next);
          break;
        }
      });
      ask.follow = picks = picks.slice(0, 2);
      if (!picks.length) return;
      var box = document.createElement('div');
      box.className = 'ask-follow';
      box.setAttribute('role', 'group');
      box.setAttribute('aria-label', 'Follow-up questions');
      picks.forEach(function(s, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'ask-chip pre';
        b.textContent = s.q;
        b.addEventListener('click', function() { askQuestion(s.q, s); });
        box.appendChild(b);
        setTimeout(function() { b.classList.remove('pre'); }, 60 + i * 90);
      });
      msgBody.appendChild(box);
    }

    function renderChips() {
      var picks = ask.seeds.filter(function(s) {
        return ask.asked.indexOf(s) < 0 && ask.follow.indexOf(s) < 0;
      }).slice(0, 3);
      askChips.innerHTML = '';
      picks.forEach(function(s, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'ask-chip pre';
        b.textContent = s.q;
        b.addEventListener('click', function() { askQuestion(s.q, s); });
        askChips.appendChild(b);
        setTimeout(function() { b.classList.remove('pre'); }, 60 + i * 90);
      });
      scrollLog();
    }

    var ASK_STOP = {};
    ('a an and are but can could did do does for from how i in is it its me my of on or so ' +
     'that the this to was were what when where which who why will would you your it\'s your').split(' ')
      .forEach(function(w) { ASK_STOP[w] = 1; });

    function askTokens(s) {
      return s.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(function(w) {
        return w.length > 2 && !ASK_STOP[w];
      });
    }

    function matchQA(text) {
      var toks = askTokens(text);
      var best = null, bestScore = 0;
      QA.forEach(function(entry) {
        var pool = askTokens(entry.q);
        var keys = entry.k || [];
        var score = 0;
        toks.forEach(function(t) {
          if (keys.indexOf(t) >= 0) score += 2;
          else if (pool.indexOf(t) >= 0) score += 1;
        });
        if (score > bestScore) { bestScore = score; best = entry; }
      });
      return bestScore >= 2 ? best : null;
    }

    askPill.addEventListener('click', function() { askOpenDrawer(null); });

    /* First-visit attract. The pill is quiet enough to read straight past, so
       a reader who has never opened the chat gets one three-beat purple pulse
       shortly after landing. Once per session (sessionStorage) so navigating
       between case pages does not re-nudge, and never for someone who has
       already used the chat (the shared 'askIntroSeen' flag). Any hover, focus
       or open cancels it early; under prefers-reduced-motion the CSS holds the
       border lit instead of pulsing, and this timer is what clears it. */
    function askAttractStop() {
      if (askAttract.timer) { clearTimeout(askAttract.timer); askAttract.timer = null; }
      askPill.classList.remove('attract');
    }
    function askAttract() {
      var skip = false;
      try {
        skip = !!localStorage.getItem('askIntroSeen') || !!sessionStorage.getItem('askPillNudged');
        sessionStorage.setItem('askPillNudged', '1');
      } catch (err) {}   /* no storage: nudge anyway, it is only decoration */
      if (skip) return;
      setTimeout(function() {
        if (document.body.classList.contains('chat-open')) return;
        askPill.classList.add('attract');
        askAttract.timer = setTimeout(askAttractStop, 7000);   /* 3 x 2.2s + slack */
      }, 1400);
    }
    askAttract();
    askPill.addEventListener('pointerenter', askAttractStop);
    askPill.addEventListener('focus', askAttractStop);
    document.getElementById('askClose').addEventListener('click', askCloseDrawer);
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.body.classList.contains('chat-open')) askCloseDrawer();
    });
    askForm.addEventListener('submit', function(e) {
      e.preventDefault();
      var v = askInput.value.trim();
      if (!v || ask.busy) return;
      askInput.value = '';
      askQuestion(v);
    });

    // ——— Resize + pop-out (Zoom-style floating window) ———
    // Width lives in --ask-w so the page squeeze tracks it; the popped
    // window is positioned by --ask-x/--ask-y and dragged by its header.
    // Geometry persists in localStorage ('askPane', shared with the other pages).
    var askPop = document.getElementById('askPop');
    var askResize = document.getElementById('askResize');
    var askHead = document.getElementById('askHead');
    var askRoot = document.documentElement;
    var ASK_MIN_W = 300, ASK_MAX_W = 720;
    var pane = { w: 360, x: null, y: 24, pop: false };
    try {
      var savedPane = JSON.parse(localStorage.getItem('askPane') || '{}');
      if (savedPane.w) pane.w = savedPane.w;
      if (savedPane.x != null) { pane.x = savedPane.x; pane.y = savedPane.y; }
    } catch (err) {}

    function askMaxW() {
      // In squeeze mode leave the column at least ~380px; overlay mode just
      // keeps a sliver of page visible.
      var reserve = window.innerWidth >= 1100 ? 380 : 120;
      return Math.max(ASK_MIN_W, Math.min(ASK_MAX_W, window.innerWidth - reserve));
    }
    function applyPane() {
      pane.w = Math.max(ASK_MIN_W, Math.min(pane.w, askMaxW()));
      if (pane.x == null) pane.x = window.innerWidth - pane.w - 24;
      pane.x = Math.max(8, Math.min(pane.x, window.innerWidth - pane.w - 8));
      // Keep the whole popped window on screen so the input stays reachable
      var popH = Math.min(600, window.innerHeight - 48);
      pane.y = Math.max(8, Math.min(pane.y, Math.max(8, window.innerHeight - popH - 8)));
      askRoot.style.setProperty('--ask-w', pane.w + 'px');
      askRoot.style.setProperty('--ask-x', pane.x + 'px');
      askRoot.style.setProperty('--ask-y', pane.y + 'px');
      // Squeeze zoom: shrink the 660px column to fit whatever the pane leaves
      var availW = window.innerWidth - pane.w;
      var z = Math.min(0.85, Math.max(0.5, (availW - 32) / 660));
      askRoot.style.setProperty('--ask-zoom', z.toFixed(3));
    }
    function savePane() {
      try { localStorage.setItem('askPane', JSON.stringify({ w: pane.w, x: pane.x, y: pane.y })); } catch (err) {}
    }
    function setPop(on) {
      pane.pop = on;
      applyPane();
      askDrawer.classList.toggle('pop', on);
      document.body.classList.toggle('chat-popped', on);
      askPop.setAttribute('aria-label', on ? 'Dock chat to side' : 'Pop out chat');
    }
    applyPane();
    askPop.addEventListener('click', function() { setPop(!pane.pop); });

    // Left-edge drag: pane mode resizes from the right edge of the screen;
    // pop mode keeps the window's right edge pinned while the width changes.
    var resizeDrag = null;
    askResize.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      resizeDrag = { right: pane.x + pane.w };
      askResize.setPointerCapture(e.pointerId);
      document.body.classList.add('ask-dragging');
    });
    askResize.addEventListener('pointermove', function(e) {
      if (!resizeDrag) return;
      if (pane.pop) {
        pane.w = Math.max(ASK_MIN_W, Math.min(resizeDrag.right - e.clientX, askMaxW()));
        pane.x = resizeDrag.right - pane.w;
      } else {
        pane.w = window.innerWidth - e.clientX;
      }
      applyPane();
    });
    function endResize() {
      if (!resizeDrag) return;
      resizeDrag = null;
      document.body.classList.remove('ask-dragging');
      savePane();
    }
    askResize.addEventListener('pointerup', endResize);
    askResize.addEventListener('pointercancel', endResize);
    askResize.addEventListener('keydown', function(e) {
      var d = e.key === 'ArrowLeft' ? 24 : e.key === 'ArrowRight' ? -24 : 0;
      if (!d) return;
      e.preventDefault();
      var right = pane.x + pane.w;
      pane.w += d;
      applyPane();
      if (pane.pop) { pane.x = right - pane.w; applyPane(); }
      savePane();
    });

    // Header drag moves the popped window anywhere on screen
    var moveDrag = null;
    askHead.addEventListener('pointerdown', function(e) {
      if (!pane.pop || e.target.closest('button')) return;
      e.preventDefault();
      moveDrag = { dx: e.clientX - pane.x, dy: e.clientY - pane.y };
      askHead.setPointerCapture(e.pointerId);
      document.body.classList.add('ask-dragging');
    });
    askHead.addEventListener('pointermove', function(e) {
      if (!moveDrag) return;
      pane.x = e.clientX - moveDrag.dx;
      pane.y = e.clientY - moveDrag.dy;
      applyPane();
    });
    function endMove() {
      if (!moveDrag) return;
      moveDrag = null;
      document.body.classList.remove('ask-dragging');
      savePane();
    }
    askHead.addEventListener('pointerup', endMove);
    askHead.addEventListener('pointercancel', endMove);

    window.addEventListener('resize', function() {
      // No room to float on small screens — fold back into the pane
      if (pane.pop && window.innerWidth < 700) setPop(false);
      else applyPane();
    }, { passive: true });
  })();

  // ——— Agentation annotation toolbar (dev only) ———
  // Point at an element, say what is wrong with it, and the note reaches the
  // coding agent already knowing which element you meant. Gated exactly like the
  // dialkit panel on index.html — the bundle is fetched only on localhost or with
  // ?agent in the URL, so a real visitor's page load is untouched and the module
  // isn't even requested. This gate is in all three pages; the dial's is not.
  // Notes live in localStorage regardless, and sync to the agent when
  // `npx agentation-mcp server` is up on 4747 (see .mcp.json).
  //   npm run agentation         build it once
  //   npm run agentation:watch   rebuild on save
  (function() {
    var host = location.hostname;
    var on = host === 'localhost' || host === '127.0.0.1' || host === '[::1]'
          || /[?&]agent(&|=|$)/.test(location.search);
    if (!on) return;
    import('./assets/agentation/agentation.js').catch(function(err) {
      console.warn('[agentation] toolbar bundle missing — run `npm run agentation`', err);
    });
  })();
  </script>
</body>
</html>
