    <!--
      Resolve the theme before the first paint. If React did this on mount the page
      would paint dark, then flip — a white flash on a dark theme is worse than no
      theme switch at all. Kept deliberately tiny and dependency-free; the storage key
      matches THEME_STORAGE_KEY in src/lib/theme.tsx.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('ac-theme')
          var system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
